name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" 
  
  workflow_dispatch:

  push:
    branches:
    - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            
            dist/github-contribution-grid-snake.svg?palette=#0d1117,#163336,#1e5e63,#298e8d,#39c5bb&hide_stack=true
            dist/github-contribution-grid-snake-dark.svg?palette=#0d1117,#163336,#1e5e63,#298e8d,#39c5bb&hide_stack=true

  

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
